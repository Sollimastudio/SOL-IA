name: Jarvis privacy and conversation contracts
on:
  push:
    branches: ['work/jarvis-neural-conversa-segura-20260908']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test without keys or paid API calls
        run: node --test tests/jarvis-chat.test.mjs tests/voice-session.test.mjs
