name: Jarvis login browser regression
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and isolated browser test runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.57.0
      - name: Install test browser
        run: npx playwright install --with-deps chromium webkit
      - name: Test entry flow with synthetic auth (no keys, no emails)
        run: npx playwright test --config tests/browser/login.playwright.config.ts
      - name: Preserve synthetic screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-login-browser
          path: test-results/login
          retention-days: 7

      - name: Preserve generated dependency lock for deterministic follow-up
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-verified-lock
          path: package-lock.json
          retention-days: 1
