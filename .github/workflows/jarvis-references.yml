name: Jarvis reference continuity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/browser/references.playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-reference-evidence
          path: test-results/references
          retention-days: 7
