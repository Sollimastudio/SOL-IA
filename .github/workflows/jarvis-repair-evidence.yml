name: Jarvis repair evidence
on:
  push:
    branches: [work/jarvis-neural-conversa-segura-20260908]
    paths: [.github/workflows/jarvis-repair-evidence.yml]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Snapshot tracked source (no environment or credentials)
        run: |
          mkdir -p repair-evidence
          git archive --format=zip HEAD -o repair-evidence/source.zip
          git rev-parse HEAD > repair-evidence/commit.txt
      - name: Read public model catalog only (no paid requests)
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          for (const [name, url] of [
            ['catalog', 'https://ai-gateway.vercel.sh/v1/models'],
            ['free-tier-page', 'https://vercel.com/ai-gateway/models?freeTier=true']
          ]) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
              const text = await response.text();
              writeFileSync(`repair-evidence/${name}.txt`, text);
              console.log(name, 'status', response.status, 'bytes', text.length);
              if (name === 'catalog') {
                const models = JSON.parse(text).data ?? [];
                console.log('catalog_fields', [...new Set(models.flatMap(m => Object.keys(m)))].sort());
                console.log('zero_price_text', models.filter(m => m.type === 'language' && m.pricing?.input === '0' && m.pricing?.output === '0').map(m => ({id:m.id,no_training:m.no_training})));
              } else {
                const matches = [...text.matchAll(/.{0,130}(?:freeTier|free_tier|free-tier|Free tier|Free Tier).{0,170}/g)].slice(0,30).map(m => m[0]);
                console.log('eligibility_markup', JSON.stringify(matches));
              }
            } catch (error) { console.log(name, 'unavailable', error.name); }
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-repair-evidence
          path: repair-evidence/
          retention-days: 1
